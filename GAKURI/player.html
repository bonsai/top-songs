<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAKURI 楽理 — Jazz Chord Player</title>
    <style>
        :root {
            --bg: #0a0a1a; --bg2: #1a1a2e; --card: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08); --text: #e2e8f0; --dim: #718096;
            --primary: #667eea; --accent: #764ba2;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'SF Pro Display','Segoe UI',system-ui,sans-serif;
            background: linear-gradient(160deg,var(--bg),var(--bg2));
            color: var(--text); min-height:100vh; padding:20px 15px 120px;
        }
        .container { max-width:960px; margin:0 auto; }
        h1 {
            text-align:center; font-size:1.6em; font-weight:300;
            letter-spacing:3px; margin-bottom:4px;
            background: linear-gradient(135deg,var(--primary),var(--accent));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .sub { text-align:center; color:var(--dim); font-size:.78em; margin-bottom:20px; }
        .moods { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
        .card {
            background:var(--card); border:1px solid var(--border); border-radius:12px;
            padding:16px; cursor:pointer; transition:all .25s; position:relative;
        }
        .card:hover { background:rgba(102,126,234,.12); border-color:var(--primary); transform:translateY(-1px); }
        .card.active { background:rgba(102,126,234,.2); border-color:var(--primary); box-shadow:0 0 20px rgba(102,126,234,.25); }
        .mood-title { font-size:1.05em; font-weight:600; margin-bottom:3px; }
        .mood-info { font-size:.72em; color:var(--dim); margin-bottom:8px; }
        .chords-row { font-family:'Consolas','Courier New',monospace; font-size:.75em; color:var(--primary); line-height:1.7; word-break:break-all; }
        .chord-tag {
            display:inline-block; background:rgba(102,126,234,.12); border:1px solid rgba(102,126,234,.2);
            border-radius:4px; padding:1px 5px; margin:1px; transition:all .2s;
        }
        .chord-tag.active { background:var(--primary); color:#fff; transform:scale(1.08); }
        .play-row { display:flex; align-items:center; gap:10px; margin-top:10px; }
        .play-btn {
            background:linear-gradient(135deg,var(--primary),var(--accent)); border:none;
            color:#fff; padding:7px 14px; border-radius:18px; cursor:pointer; font-size:.8em;
            transition:all .15s;
        }
        .play-btn:hover { transform:scale(1.05); }
        .bpm-badge { font-size:.65em; color:var(--dim); background:rgba(255,255,255,.06); padding:2px 7px; border-radius:8px; }

        /* Fixed bottom player */
        .bottom-bar {
            position:fixed; bottom:0; left:0; right:0;
            background:rgba(10,10,26,.95); backdrop-filter:blur(12px);
            border-top:1px solid var(--border); padding:12px 20px;
            display:none; align-items:center; gap:14px; z-index:200;
        }
        .bottom-bar.show { display:flex; }
        .stop-btn {
            width:38px; height:38px; border-radius:50%; border:none;
            background:#e53e3e; color:#fff; cursor:pointer; font-size:1em;
        }
        .np { flex:1; }
        .np-title { font-weight:600; font-size:.95em; }
        .np-detail { font-size:.72em; color:var(--dim); font-family:'Consolas',monospace; }
        .vol { display:flex; align-items:center; gap:6px; color:var(--dim); font-size:.75em; }
        .vol input { width:70px; accent-color:var(--primary); }

        /* Tension curve canvas */
        .curve-canvas {
            width:100%; height:50px; border-radius:6px; margin-top:8px;
            background:rgba(0,0,0,.3);
        }

        /* Info box */
        .info-box {
            background:var(--card); border:1px solid var(--border); border-radius:12px;
            padding:18px; margin-top:16px; font-size:.78em; color:var(--dim); line-height:1.7;
        }
        .info-box code { background:rgba(102,126,234,.15); padding:1px 5px; border-radius:3px; }
        .info-box h3 { color:var(--primary); font-size:.95em; margin-bottom:6px; }
    </style>
</head>
<body>
<div class="container">
    <h1>GAKURI 楽理</h1>
    <p class="sub">Jazz Chord Progression Player — Pure Web Audio API, no dependencies</p>
    <div class="moods" id="moods"></div>
    <div class="info-box">
        <h3>🎹 音の仕組み</h3>
        <p>Web Audio API でリアルタイム合成。三角波 + 倍音 + リバーブでピアノ風音色。ドロップ2 ボイシングでジャズらしい響きを実現。</p>
        <p style="margin-top:6px">クリックすると即座に再生。テンポは mood ごとに最適化。</p>
    </div>
</div>

<div class="bottom-bar" id="bottomBar">
    <button class="stop-btn" onclick="stopAll()">⏹</button>
    <div class="np">
        <div class="np-title" id="npTitle">—</div>
        <div class="np-detail" id="npDetail">—</div>
    </div>
    <div class="vol">🔊 <input type="range" id="volSlider" min="0" max="100" value="60" oninput="setVol(this.value)"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// GAKURI — Pure JS Jazz Chord Player
// ═══════════════════════════════════════════════════════════

const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

// ── Jazz Voicing: Drop-2 intervals per chord type ──
// Format: [semitones from root] — voicing-friendly
const VOICINGS = {
    'maj7':  [[0,4,7,11],[4,7,11,12]],     // root + 1st inversion
    'm7':    [[0,3,7,10],[3,7,10,12]],
    '7':     [[0,4,7,10],[4,7,10,12]],
    'm7b5':  [[0,3,6,10],[3,6,10,12]],
    'dim7':  [[0,3,6,9]],
    'maj9':  [[0,4,7,11,14],[4,7,11,14,16]],
    'm9':    [[0,3,7,10,14],[3,7,10,14,16]],
    '9':     [[0,4,7,10,14],[4,7,10,14,16]],
    '11':    [[0,4,7,10,17]],
    '13':    [[0,4,7,10,21]],
    '6/9':   [[0,4,7,9,14]],
    '7b9':   [[0,4,7,10,13]],
    '7#9':   [[0,4,7,10,15]],
    '7#11':  [[0,4,7,10,18]],
    '7b13':  [[0,4,7,10,20]],
    'alt':   [[0,4,7,10,13,15,18]],

// Default voicing for unknown types
const DEFAULT_VOICING = [0,4,7,10];

// ── Mood Definitions ──

    },

        chords:[
            {n:'Cm9',  r:0,  t:'m9'},  {n:'Fm7',  r:5,  t:'m7'},
            {n:'Bbmaj7',r:10, t:'maj7'},{n:'Am7b5',r:9,  t:'m7b5'},
            {n:'D7b9', r:2,  t:'7b9'}, {n:'Gm9',  r:7,  t:'m9'},
            {n:'Cm9',  r:0,  t:'m9'},  {n:'Abmaj7',r:8, t:'maj7'},
            {n:'Bbm7', r:10, t:'m7'},  {n:'Fm7',  r:5,  t:'m7'},
        ]
    },

            {n:'Cmaj7',r:0,  t:'maj7'},{n:'Dm7',  r:2,  t:'m7'},
            {n:'Em7',  r:4,  t:'m7'},  {n:'Fmaj9',r:5,  t:'maj9'},

        ]
    },

        name:'Noir', arc:'Ascending (extreme) — dark tension', color:'#718096', bpm:108,
        chords:[
            {n:'Cm9',  r:0,  t:'m9'},  {n:'Fm7',  r:5,  t:'m7'},
            {n:'Bb13', r:10, t:'13'},  {n:'Ebmaj9',r:3, t:'maj9'},
            {n:'Am7b5',r:9,  t:'m7b5'},{n:'D7b9', r:2,  t:'7b9'},
            {n:'Gm9',  r:7,  t:'m9'},  {n:'C7#11',r:0,  t:'7#11'},
            {n:'Fm9',  r:5,  t:'m9'},  {n:'Bb7#11',r:10, t:'7#11'},
            {n:'Eb6',  r:3,  t:'maj7'},{n:'Abmaj7',r:8,  t:'maj7'},

            {n:'Cmaj7',r:0,  t:'maj7'},{n:'Em9',  r:4,  t:'m9'},
            {n:'Abmaj7',r:8, t:'maj7'},{n:'G7#11',r:7,  t:'7#11'},
            {n:'Cmaj9',r:0,  t:'maj9'},
        ]
    },
    peaceful: {
        name:'Peaceful', arc:'Descending (gentle) — calm', color:'#63b3ed', bpm:76,
        chords:[
            {n:'Cmaj7',r:0,  t:'maj7'},{n:'G/B',  r:7,  t:'maj7'},
            {n:'Am7',  r:9,  t:'m7'},  {n:'Fmaj7',r:5,  t:'maj7'},
            {n:'Em7',  r:4,  t:'m7'},  {n:'Dm7',  r:2,  t:'m7'},
            {n:'G7',   r:7,  t:'7'},   {n:'Cmaj7',r:0,  t:'maj7'},
        ]
    },
    dramatic: {
        name:'Dramatic', arc:'Convex (extreme) — cinematic', color:'#e53e3e', bpm:120,
        chords:[
            {n:'Cm9',  r:0,  t:'m9'},  {n:'Abmaj7',r:8, t:'maj7'},
            {n:'Bb7',  r:10, t:'7'},   {n:'Ebmaj9',r:3, t:'maj9'},
            {n:'Fm9',  r:5,  t:'m9'},  {n:'G7alt', r:7, t:'alt'},
            {n:'Cm9',  r:0,  t:'m9'},  {n:'Dm7b5', r:2, t:'m7b5'},
            {n:'G7b9', r:7,  t:'7b9'}, {n:'Cmmaj7',r:0,  t:'maj7'},
            {n:'Abmaj7',r:8, t:'maj7'},{n:'Bb7#11',r:10, t:'7#11'},
            {n:'Ebmaj9',r:3, t:'maj9'},{n:'Fm7',  r:5,  t:'m7'},
            {n:'G7b13',r:7,  t:'7b13'},{n:'Cm9',  r:0,  t:'m9'},
        ]
    },
    bittersweet: {
        name:'Bittersweet', arc:'Concave — joy + sadness', color:'#d69e2e', bpm:98,
        chords:[
            {n:'Cmaj7',r:0,  t:'maj7'},{n:'Em7',  r:4,  t:'m7'},
            {n:'Am9',  r:9,  t:'m9'},  {n:'Fm7',  r:5,  t:'m7'},
            {n:'Cmaj7',r:0,  t:'maj7'},{n:'E7',   r:4,  t:'7'},
            {n:'Am9',  r:9,  t:'m9'},  {n:'Dm9',  r:2,  t:'m9'},
            {n:'G13',  r:7,  t:'13'},  {n:'Cmaj9',r:0,  t:'maj9'},
            {n:'Abmaj7',r:8, t:'maj7'},{n:'G7#11',r:7,  t:'7#11'},
        ]
    },
};

// ═══════════════════════════════════════════════════════════
// Web Audio Engine
// ═══════════════════════════════════════════════════════════

let actx = null, master = null, convolver = null, isPlaying = false;
let timeouts = [], activeOscs = [];
let currentMood = null, chordIdx = 0;

function initAudio() {
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = 0.55;
    
    // Create reverb via impulse response
    convolver = actx.createConvolver();
    const sr = actx.sampleRate, len = sr * 2;
    const ir = actx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.5);
    }
    convolver.buffer = ir;
    
    const wet = actx.createGain();
    wet.gain.value = 0.25;
    convolver.connect(wet);
    wet.connect(actx.destination);
    master.connect(convolver);
    master.connect(actx.destination);
}

function midiFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

function playChordAt(rootPC, type, time, dur, vel = 0.45) {
    // Get voicing intervals
    let intervals = VOICINGS[type] || DEFAULT_VOICING;
    // Pick drop-2 voicing randomly if multiple available
    if (Array.isArray(intervals[0])) intervals = intervals[Math.floor(Math.random()*intervals.length)];
    
    // Base octave: spread across piano range
    const baseMidi = 48 + rootPC; // C3 area
    
    intervals.forEach((interval, i) => {
        const midi = baseMidi + interval;
        const freq = midiFreq(midi);
        
        // Main tone — triangle
        const osc = actx.createOscillator();
        const env = actx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        osc.detune.value = (Math.random()-.5)*4;
        
        env.gain.setValueAtTime(0.0001, time);
        env.gain.linearRampToValueAtTime(vel * 0.28, time + 0.012);
        env.gain.exponentialRampToValueAtTime(vel * 0.12, time + dur*0.25);
        env.gain.exponentialRampToValueAtTime(0.0001, time + dur*0.96);
        
        osc.connect(env);
        env.connect(master);
        osc.start(time);
        osc.stop(time + dur + 0.1);
        activeOscs.push(osc);
        
        // 2nd harmonic — quiet sine
        const osc2 = actx.createOscillator();
        const env2 = actx.createGain();
        osc2.type = 'sine';
        osc2.frequency.value = freq * 2;
        env2.gain.setValueAtTime(0.0001, time);
        env2.gain.linearRampToValueAtTime(vel * 0.04, time + 0.008);
        env2.gain.exponentialRampToValueAtTime(0.0001, time + dur*0.6);
        osc2.connect(env2);
        env2.connect(master);
        osc2.start(time);
        osc2.stop(time + dur + 0.1);
        activeOscs.push(osc2);
        
        // 3rd harmonic — very quiet
        if (i < 3) {
            const osc3 = actx.createOscillator();
            const env3 = actx.createGain();
            osc3.type = 'sine';
            osc3.frequency.value = freq * 3;
            env3.gain.setValueAtTime(0.0001, time);
            env3.gain.linearRampToValueAtTime(vel * 0.015, time + 0.005);
            env3.gain.exponentialRampToValueAtTime(0.0001, time + dur*0.4);
            osc3.connect(env3);
            env3.connect(master);
            osc3.start(time);
            osc3.stop(time + dur + 0.1);
            activeOscs.push(osc3);
        }
    });
}

// ── Play / Stop ──

function playMood(key) {
    if (isPlaying) stopAll();
    initAudio();
    
    const mood = MOODS[key];
    if (!mood) return;
    isPlaying = true;
    currentMood = key;
    chordIdx = 0;
    
    // UI
    const bar = document.getElementById('bottomBar');
    bar.classList.add('show');
    document.getElementById('npTitle').textContent = `🎵 ${mood.name}`;
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.getElementById(`card-${key}`)?.classList.add('active');
    
    // Timing
    const beatSec = 60 / mood.bpm;
    const chordDur = beatSec * 2; // each chord = 2 beats
    const now = actx.currentTime + 0.15;
    
    // Schedule all chords
    mood.chords.forEach((ch, i) => {
        const t = now + i * chordDur;
        playChordAt(ch.r, ch.t, t, chordDur * 0.95, 0.45);
        
        // Visual highlight
        const tid = setTimeout(() => {
            if (!isPlaying) return;
            document.querySelectorAll('.chord-tag').forEach(tg => tg.classList.remove('active'));
            const tag = document.getElementById(`tag-${key}-${i}`);
            if (tag) { tag.classList.add('active'); tag.scrollIntoView({block:'nearest',behavior:'smooth'}); }
            document.getElementById('npDetail').textContent = `${mood.bpm} BPM | Chord ${i+1}/${mood.chords.length}: ${ch.n}`;
            drawCurve(key, i);
        }, (t - now) * 1000);
        timeouts.push(tid);
    });
    
    // Auto-stop
    const totalMs = mood.chords.length * chordDur * 1000 + 500;
    timeouts.push(setTimeout(() => stopAll(), totalMs));
}

function stopAll() {
    isPlaying = false;
    timeouts.forEach(t => clearTimeout(t));
    timeouts = [];
    activeOscs.forEach(o => { try { o.stop(); } catch(e){} });
    activeOscs = [];
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.chord-tag').forEach(t => t.classList.remove('active'));
    document.getElementById('npDetail').textContent = 'Stopped';
}

function setVol(v) { if (master) master.gain.value = v / 100; }

// ── Tension Curve Drawing ──

function drawCurve(moodKey, activeIdx) {
    const canvas = document.getElementById(`curve-${moodKey}`);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const mood = MOODS[moodKey];
    const n = mood.chords.length;
    
    ctx.clearRect(0, 0, w, h);
    
    // Background grid
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
        const y = (h / 4) * i;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    
    // Generate curve
    const arc = mood.arc;
    const pts = [];
    for (let i = 0; i < n; i++) {
        const t = n > 1 ? i / (n - 1) : 0;
        let v;
        if (arc.includes('Ascending') && !arc.includes('extreme')) v = 0.25 + 0.65 * t;
        else if (arc.includes('Ascending')) v = 0.15 + 0.8 * t;
        else if (arc.includes('Descending') && !arc.includes('gentle')) v = 0.85 - 0.65 * t;
        else if (arc.includes('Descending')) v = 0.7 - 0.45 * t;
        else if (arc.includes('Convex') && !arc.includes('extreme')) v = 0.25 + 0.65 * 4 * t * (1 - t);
        else if (arc.includes('Convex')) v = 0.1 + 0.85 * 4 * t * (1 - t);
        else if (arc.includes('Concave') && !arc.includes('moderate')) v = 0.65 - 0.35 * 4 * t * (1 - t);
        else if (arc.includes('Concave')) v = 0.6 - 0.3 * 4 * t * (1 - t);
        else v = 0.5 + 0.3 * Math.sin(3 * Math.PI * t);
        pts.push(Math.max(0.05, Math.min(0.95, v)));
    }
    
    // Draw line
    ctx.beginPath();
    ctx.strokeStyle = mood.color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    pts.forEach((v, i) => {
        const x = (i / (n - 1)) * (w - 10) + 5;
        const y = h - v * (h - 10) - 5;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
    
    // Draw dots
    pts.forEach((v, i) => {
        const x = (i / (n - 1)) * (w - 10) + 5;
        const y = h - v * (h - 10) - 5;
        ctx.beginPath();
        ctx.arc(x, y, i === activeIdx ? 5 : 3, 0, Math.PI * 2);
        ctx.fillStyle = i === activeIdx ? '#fff' : mood.color;
        ctx.fill();
        if (i === activeIdx) {
            ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2);
            ctx.strokeStyle = mood.color + '80';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }
    });
}

// ── Build UI ──

function buildUI() {
    const grid = document.getElementById('moods');
    Object.entries(MOODS).forEach(([key, mood]) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${key}`;
        
        const chordsHtml = mood.chords.map((ch, i) =>
            `<span class="chord-tag" id="tag-${key}-${i}">${ch.n}</span>`
        ).join(' ');
        
        card.innerHTML = `
            <div class="mood-title" style="color:${mood.color}">${mood.name}</div>
            <div class="mood-info">${mood.arc} · <span class="bpm-badge">${mood.bpm} BPM</span></div>
            <div class="chords-row">${chordsHtml}</div>
            <canvas class="curve-canvas" id="curve-${key}" width="280" height="50"></canvas>
            <div class="play-row">
                <button class="play-btn" onclick="event.stopPropagation(); playMood('${key}')">▶ Play</button>
            </div>
        `;
        
        card.onclick = () => playMood(key);
        grid.appendChild(card);
        
        // Draw initial curve
        setTimeout(() => drawCurve(key, -1), 50);
    });
}

buildUI();
</script>
</body>
</html>
