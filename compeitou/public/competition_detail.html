<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🏆Compeitou - コンペ詳細🏆</title>
    <!-- Firebase SDK (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
</head>
<body bgcolor="#F0F0F0">
<center>
    <table width="80%" bgcolor="#FFFFFF" cellpadding="5" cellspacing="1" border="0">
        <tr bgcolor="#CCCCCC">
            <td align="center"><font size="+2" color="#000000"><b>🏆Compeitou - コンペ詳細🏆</b></font></td>
        </tr>
        <tr bgcolor="#EEEEEE">
            <td align="right">
                <a href="./index.html"><font color="#0000FF">トップページへ</font></a>
            </td>
        </tr>
    </table>
    <br>

    <table width="80%" bgcolor="#FFFFFF" cellpadding="5" cellspacing="1" border="0">
        <tr bgcolor="#DDDDDD">
            <td><font size="+1" color="#000000"><b>コンペタイトル: <span id="competition-detail-title"></span></b></font></td>
        </tr>
        <tr bgcolor="#FFFFFF">
            <td>
                <font color="#000000">主催者: <span id="competition-detail-host"></span></font><br>
                <font color="#000000">締め切り: <span id="competition-detail-deadline"></span></font><br>
                <font color="#000000">説明:</font><br>
                <span id="competition-detail-description"></span>
            </td>
        </tr>
    </table>
    <br>

    <table width="80%" bgcolor="#FFFFFF" cellpadding="5" cellspacing="1" border="0">
        <tr bgcolor="#DDDDDD">
            <td><font size="+1" color="#000000"><b>✍️作品一覧</b></font></td>
        </tr>
        <tr bgcolor="#EEEEEE" id="submit-entry-row">
            <td align="right">
                <a href="./submit_entry.html?competitionId=" id="submit-entry-link"><font color="#0000FF">作品を投稿する</font></a>
            </td>
        </tr>
    </table>

    <table width="80%" bgcolor="#FFFFFF" cellpadding="5" cellspacing="1" border="0" id="submissions-list">
        <!-- 作品一覧はJavaScriptでここに動的に挿入されます -->
        <tr bgcolor="#EEEEFF">
            <td><font color="#888888">まだ作品は投稿されていません。</font></td>
        </tr>
    </table>
    <br>

    <div id="host-actions" style="display:none;">
        <table width="80%" bgcolor="#FFFFFF" cellpadding="5" cellspacing="1" border="0">
            <tr bgcolor="#DDDDDD">
                <td><font size="+1" color="#000000"><b>主催者アクション</b></font></td>
            </tr>
            <tr bgcolor="#FFFFFF">
                <td>
                    <input type="button" value="優勝者を決定する" id="decide-winner-button"><br>
                    <input type="button" value="コンペの公開状態を切り替える" id="toggle-publish-button">
                </td>
            </tr>
        </table>
        <br>
    </div>

    <table width="80%" bgcolor="#FFFFFF" cellpadding="5" cellspacing="1" border="0">
        <tr bgcolor="#CCCCCC">
            <td align="center"><font size="-1" color="#000000">&copy; 2026 Compeitou. All Rights Reserved.</font></td>
        </tr>
    </table>
</center>

<script src="./js/app.js"></script>
</body>
</html>
