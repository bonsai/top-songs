<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🔒Compeitou - ログイン / サインアップ🔒</title>
    <!-- Firebase SDK (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
</head>
<body bgcolor="#F0F0F0">
<center>
    <table width="80%" bgcolor="#FFFFFF" cellpadding="5" cellspacing="1" border="0">
        <tr bgcolor="#CCCCCC">
            <td align="center"><font size="+2" color="#000000"><b>🔒Compeitou - ログイン / サインアップ🔒</b></font></td>
        </tr>
        <tr bgcolor="#EEEEEE">
            <td align="right">
                <a href="./index.html"><font color="#0000FF">トップページへ</font></a>
            </td>
        </tr>
    </table>
    <br>

    <table width="80%" bgcolor="#FFFFFF" cellpadding="5" cellspacing="1" border="0">
        <tr bgcolor="#DDDDDD">
            <td><font size="+1" color="#000000"><b>💡サインアップ</b></font></td>
        </tr>
        <tr bgcolor="#FFFFFF">
            <td>
                <form id="signup-form">
                    <font color="#000000">メールアドレス:</font><br>
                    <input type="text" id="signup-email" size="40"><br>
                    <font color="#000000">パスワード:</font><br>
                    <input type="password" id="signup-password" size="40"><br>
                    <br>
                    <input type="submit" value="サインアップ">
                </form>
            </td>
        </tr>
    </table>
    <br>

    <table width="80%" bgcolor="#FFFFFF" cellpadding="5" cellspacing="1" border="0">
        <tr bgcolor="#DDDDDD">
            <td><font size="+1" color="#000000"><b>🔑ログイン</b></font></td>
        </tr>
        <tr bgcolor="#FFFFFF">
            <td>
                <form id="login-form">
                    <font color="#000000">メールアドレス:</font><br>
                    <input type="text" id="login-email" size="40"><br>
                    <font color="#000000">パスワード:</font><br>
                    <input type="password" id="login-password" size="40"><br>
                    <br>
                    <input type="submit" value="ログイン">
                </form>
                <br>
                <a href="#" id="reset-password-link"><font color="#0000FF">パスワードを忘れた場合</font></a>
            </td>
        </tr>
    </table>
    <br>

    <table width="80%" bgcolor="#FFFFFF" cellpadding="5" cellspacing="1" border="0">
        <tr bgcolor="#CCCCCC">
            <td align="center"><font size="-1" color="#000000">&copy; 2026 Compeitou. All Rights Reserved.</font></td>
        </tr>
    </table>
</center>

<script src="./js/app.js"></script>
</body>
</html>
