<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>💡Compeitou - コンペ主催💡</title>
    <!-- Firebase SDK (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
</head>
<body bgcolor="#F0F0F0">
<center>
    <table width="80%" bgcolor="#FFFFFF" cellpadding="5" cellspacing="1" border="0">
        <tr bgcolor="#CCCCCC">
            <td align="center"><font size="+2" color="#000000"><b>💡Compeitou - コンペ主催💡</b></font></td>
        </tr>
        <tr bgcolor="#EEEEEE">
            <td align="right">
                <a href="./index.html"><font color="#0000FF">トップページへ</font></a>
            </td>
        </tr>
    </table>
    <br>

    <table width="80%" bgcolor="#FFFFFF" cellpadding="5" cellspacing="1" border="0">
        <tr bgcolor="#DDDDDD">
            <td><font size="+1" color="#000000"><b>コンペを作成する</b></font></td>
        </tr>
        <tr bgcolor="#FFFFFF">
            <td>
                <form id="create-competition-form">
                    <font color="#000000">コンペの定義 (100字以内):</font><br>
                    <input type="text" id="competition-title" size="60" maxlength="100"><br>
                    <font color="#000000">詳細説明:</font><br>
                    <textarea id="competition-description" rows="5" cols="60"></textarea><br>
                    <font color="#000000">締め切り:</font><br>
                    <input type="datetime-local" id="competition-deadline"><br>
                    <font color="#000000">公開する:</font>
                    <input type="checkbox" id="competition-is-published" checked><br>
                    <br>
                    <input type="submit" value="コンペを作成">
                </form>
            </td>
        </tr>
    </table>
    <br>

    <table width="80%" bgcolor="#FFFFFF" cellpadding="5" cellspacing="1" border="0">
        <tr bgcolor="#CCCCCC">
            <td align="center"><font size="-1" color="#000000">&copy; 2026 Compeitou. All Rights Reserved.</font></td>
        </tr>
    </table>
</center>

</body>
</html>
