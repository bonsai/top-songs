<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kworb Spotify Chart - Preview Player</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#121212;color:#fff;line-height:1.5;padding:16px}
    body.player-visible{padding-bottom:150px}
    .header{text-align:center;padding:20px;background:linear-gradient(135deg,#1DB954,#191414);border-radius:12px;margin-bottom:20px}
    .header h1{font-size:1.5rem;margin-bottom:8px}
    .header p{opacity:.8;font-size:.9rem}
    .controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
    .controls select,.controls button{padding:8px 16px;border:none;border-radius:8px;background:#282828;color:#fff;cursor:pointer;font-size:.9rem}
    .controls button:hover{background:#1DB954}
    .controls button:disabled{opacity:.5;cursor:not-allowed}
    .chart-container{overflow-x:auto;background:#181818;border-radius:12px;padding:8px}
    table{width:100%;border-collapse:collapse;min-width:900px;font-size:.9rem}
    body.focus-mode table{min-width:0}
    th{position:sticky;top:0;background:#282828;padding:12px 8px;text-align:left;font-weight:600;border-bottom:2px solid #404040;z-index:10}
    td{padding:10px 8px;border-bottom:1px solid #282828;vertical-align:middle}
    tr:hover{background:#282828}
    tr.active-track{background:rgba(29,185,84,.25)!important;box-shadow:inset 3px 0 0 #1DB954}
    tr.active-track .rank{color:#1DB954}
    .rank{font-weight:700;width:40px;text-align:center}
    .rank-change{width:30px;text-align:center;font-size:.8rem;color:#1DB954}
    .rank-change.down{color:#e22134}
    .rank-change.same{color:#2e2e2e}
    .track-cell{display:flex;align-items:center;gap:10px;max-width:420px}
    body.focus-mode .track-cell{max-width:none}
    .track-info{flex:1;min-width:0}
    .track-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .track-artist{font-size:.8rem;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .track-title a,.track-artist a{color:inherit;text-decoration:none}
    .track-title a:hover,.track-artist a:hover{text-decoration:underline}
    .track-links{display:flex;gap:8px;flex-shrink:0;align-items:center}
    .inline-link{color:#666;text-decoration:none;font-size:.75rem;white-space:nowrap;border:1px solid #2a2a2a;padding:2px 8px;border-radius:4px;transition:color .15s,border-color .15s}
    .inline-link:hover{color:#1DB954;border-color:#1DB954;text-decoration:none}
    .preview-btn{flex-shrink:0;width:30px;height:30px;border-radius:6px;background:transparent;border:1px solid #333;color:#888;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s}
    .preview-btn:hover{background:#1DB954;border-color:#1DB954;color:#fff;transform:scale(1.05)}
    .preview-btn:active{transform:scale(.95)}
    .streams{text-align:right;font-variant-numeric:tabular-nums}
    .days{text-align:center;width:50px}
    .peak{text-align:center;width:40px}
    /* フォーカスモード: 余計な列を隠す (Days/Pk/Streams/7Day/Total) */
    body.focus-mode th:nth-child(n+4),
    body.focus-mode td:nth-child(n+4){display:none}
    /* プレーヤーバー (固定下部) */
    .player-bar{position:fixed;bottom:0;left:0;right:0;background:#141414;border-top:1px solid #232323;z-index:1000;display:none}
    .player-bar.active{display:block}
    .player-progress{height:2px;background:#232323;overflow:hidden}
    .player-progress-fill{height:100%;background:#1DB954;width:0}
    .player-info{display:flex;align-items:center;gap:10px;padding:10px 16px}
    .player-now{width:7px;height:7px;border-radius:50%;background:#1DB954;flex-shrink:0;animation:playing-dot 2s ease-in-out infinite}
    @keyframes playing-dot{0%,100%{opacity:1}50%{opacity:.25}}
    .player-title{flex:1;font-size:.88rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:#ddd}
    .player-timer{font-size:.75rem;color:#555;min-width:26px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}
    .player-controls{display:flex;gap:4px;flex-shrink:0;align-items:center}
    .player-btn{width:28px;height:28px;border-radius:6px;border:1px solid #333;color:#888;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;background:transparent;transition:all .15s;flex-shrink:0}
    .player-btn:hover{background:#232323;color:#ddd;border-color:#444}
    .player-btn.active-btn{border-color:#1DB954;color:#1DB954;background:transparent}
    .player-btn.active-btn:hover{background:rgba(29,185,84,.1)}
    .player-btn.stop-btn{border-color:#333;color:#666;background:transparent}
    .player-btn.stop-btn:hover{border-color:#e22134;color:#e22134;background:transparent}
    .player-iframe-wrap{overflow:hidden;transition:height .2s ease}
    .player-iframe-wrap.expanded{height:80px}
    .player-iframe-wrap.collapsed{height:0}
    .player-iframe-wrap iframe{width:100%;height:80px;border:none;display:block}
    .loading-msg{text-align:center;padding:40px;color:#888}
    .error-msg{text-align:center;padding:40px;color:#e22134;background:rgba(226,33,52,.1);border-radius:8px;margin:20px 0}
    .footer{text-align:center;padding:20px;color:#888;font-size:.8rem}
    .footer a{color:#1DB954;text-decoration:none}
    @media(max-width:768px){.header h1{font-size:1.2rem}th,td{padding:8px 4px;font-size:.8rem}.track-cell{max-width:200px}}
  </style>
</head>
<body>
<div class="header">
  <h1>🎵 Kworb Spotify Global Daily Chart</h1>
  <p>曲名は Last.fm、アーティスト名は Discogs、spotify▶ は自動再生して15秒ごとに次曲へ移動、youtube▶ は検索へリンク</p>
</div>
<div class="controls">
  <select id="countrySelect">
    <option value="global">Global</option>
    <option value="us">United States</option>
    <option value="jp">Japan</option>
    <option value="gb">United Kingdom</option>
    <option value="de">Germany</option>
    <option value="fr">France</option>
    <option value="es">Spain</option>
    <option value="it">Italy</option>
    <option value="br">Brazil</option>
    <option value="mx">Mexico</option>
    <option value="kr">South Korea</option>
    <option value="ca">Canada</option>
    <option value="au">Australia</option>
  </select>
  <button id="loadBtn" onclick="loadChart()">🔄 チャートを読み込み</button>
  <button id="refreshBtn" onclick="refreshChart()">🔃 更新</button>
</div>
<div id="chartArea">
  <div class="loading-msg">▶ 「チャートを読み込み」ボタンをクリックしてデータを読み込んでください</div>
</div>
<div class="footer">
  <p>Data source: <a href="https://kworb.net" target="_blank">kworb.net</a> | Preview via <a href="https://developer.spotify.com/documentation/embeds" target="_blank">Spotify Embed API</a></p>
  <p>※ プレビューは30秒間のサンプルです。完全再生にはSpotifyアプリが必要です。</p>
</div>

<!-- 固定下部プレーヤーバー -->
<div id="playerBar" class="player-bar">
  <div class="player-progress"><div id="progressFill" class="player-progress-fill"></div></div>
  <div class="player-info">
    <span class="player-now"></span>
    <span id="playerTitle" class="player-title">-</span>
    <span id="playerTimer" class="player-timer">15s</span>
    <div class="player-controls">
      <a id="spotifyFallbackLink" class="inline-link" href="#" target="_blank" rel="noopener noreferrer">open</a>
      <button class="player-btn active-btn" id="focusBtn" onclick="toggleFocusMode()" title="フォーカスモード（余計な情報を隠す）">◎</button>
      <button class="player-btn active-btn" id="expandBtn" onclick="togglePlayerIframe()" title="プレーヤー表示切替">▼</button>
      <button class="player-btn stop-btn" onclick="stopPlayback()" title="停止 (Esc)">✕</button>
    </div>
  </div>
  <div id="playerIframeWrap" class="player-iframe-wrap expanded">
    <iframe id="spotifyFrame" src="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>
</div>

<script>
const CONFIG={proxyBase:'/api/proxy?url=',kworbBase:'https://kworb.net/spotify/country/',spotifyEmbedBase:'https://open.spotify.com/embed/search/'};
let chartData=[],currentCountry='global',activePlayIndex=-1,playTimer=null,countdownInterval=null;
let focusMode=true,iframeVisible=true;

function showLoading(m='読み込み中...'){document.getElementById('chartArea').innerHTML='<div class="loading-msg">⏳ '+m+'</div>'}
function showError(m){document.getElementById('chartArea').innerHTML='<div class="error-msg">❌ '+m+'<br><small>ネットワーク接続またはCORSプロキシの問題かもしれません</small></div>'}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function formatNumber(n){if(n===undefined||n===null)return'-';return Number(n).toLocaleString('en-US')}
function parseArtistTitle(t){const m=(t||'').trim().match(/^([^-\\]+?)\s*[-\\]\s*(.+)$/);if(m){let title=m[2].trim();title=title.replace(/\s*\(w\/[^)]+\)\s*$/,'').trim();return{artist:m[1].trim(),title}}return{artist:'Unknown',title:(t||'').trim()}}
function createExternalUrl(kind,artist,title){const q=(artist+' '+title).trim();if(kind==='lastfm')return'https://www.last.fm/search/tracks?q='+encodeURIComponent(q);
if(kind==='spotify')return'https://open.spotify.com/search/'+encodeURIComponent(q);
if(kind==='youtube')return'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
if(kind==='discogs')return'https://www.discogs.com/search/?type=artist&q='+encodeURIComponent(artist);
return'#'}

function clearPlayTimer(){if(playTimer){clearTimeout(playTimer);playTimer=null}}
function clearCountdown(){if(countdownInterval){clearInterval(countdownInterval);countdownInterval=null}}
function handleEscape(e){if(e.key==='Escape')stopPlayback()}

function setActiveTrack(index){
  document.querySelectorAll('tr.active-track').forEach(r=>r.classList.remove('active-track'));
  const row=document.querySelector('tr[data-row-index="'+index+'"]');
  if(!row)return;
  row.classList.add('active-track');
  row.scrollIntoView({behavior:'smooth',block:'center'});
}

function startProgressBar(){
  const fill=document.getElementById('progressFill');
  fill.style.transition='none';
  fill.style.width='0';
  void fill.offsetWidth; // force reflow to restart transition
  fill.style.transition='width 15s linear';
  fill.style.width='100%';
}

function startCountdown(){
  clearCountdown();
  let rem=15;
  document.getElementById('playerTimer').textContent=rem+'s';
  countdownInterval=setInterval(()=>{
    rem--;
    if(rem<=0){clearCountdown();document.getElementById('playerTimer').textContent='→'}
    else document.getElementById('playerTimer').textContent=rem+'s';
  },1000);
}

function scheduleNextTrack(){
  clearPlayTimer();
  if(activePlayIndex<0||activePlayIndex>=chartData.length-1)return;
  startProgressBar();
  startCountdown();
  playTimer=setTimeout(()=>playPreviewAt(activePlayIndex+1),15000);
}

function playPreviewAt(index){
  const track=chartData[index];if(!track)return;
  activePlayIndex=index;
  setActiveTrack(index);
  playPreview(track.artist,track.title);
}

function playPreview(artist,title){
  const q=encodeURIComponent((artist+' '+title).trim());
  const url=CONFIG.spotifyEmbedBase+q+'?utm_source=generator&autoplay=1';
  document.getElementById('playerTitle').textContent=artist+' - '+title;
  document.getElementById('spotifyFallbackLink').href=createExternalUrl('spotify',artist,title);
  document.getElementById('spotifyFrame').src=url;
  document.getElementById('playerBar').classList.add('active');
  document.body.classList.add('player-visible');
  document.body.classList.toggle('focus-mode',focusMode);
  scheduleNextTrack();
}

function stopPlayback(){
  clearPlayTimer();
  clearCountdown();
  document.getElementById('playerBar').classList.remove('active');
  document.getElementById('spotifyFrame').src='';
  document.body.classList.remove('player-visible','focus-mode');
  activePlayIndex=-1;
  document.querySelectorAll('tr.active-track').forEach(r=>r.classList.remove('active-track'));
  const fill=document.getElementById('progressFill');
  fill.style.transition='none';fill.style.width='0';
  document.getElementById('playerTimer').textContent='15s';
}

function toggleFocusMode(){
  focusMode=!focusMode;
  document.getElementById('focusBtn').classList.toggle('active-btn',focusMode);
  if(document.getElementById('playerBar').classList.contains('active')){
    document.body.classList.toggle('focus-mode',focusMode);
  }
}

function togglePlayerIframe(){
  iframeVisible=!iframeVisible;
  const wrap=document.getElementById('playerIframeWrap');
  wrap.classList.toggle('expanded',iframeVisible);
  wrap.classList.toggle('collapsed',!iframeVisible);
  document.getElementById('expandBtn').textContent=iframeVisible?'▼':'▲';
}

function renderChart(data,country){
  const c=document.getElementById('chartArea');
  if(!data||data.length===0){showError('チャートデータの取得に失敗しました');return}
  let h='<table><thead><tr><th class="rank">#</th><th class="rank-change">Δ</th><th>Artist - Title</th><th class="days">Days</th><th class="peak">Pk</th><th class="streams">Streams</th><th class="streams">7Day</th><th class="streams">Total</th></tr></thead><tbody>';
  data.forEach((r,index)=>{
    const cc=r.change>0?'':r.change<0?'down':'same';
    const cs=r.change>0?'+'+r.change:r.change<0?r.change:'=';
    h+='<tr data-row-index="'+index+'"><td class="rank">'+r.rank+'</td><td class="rank-change '+cc+'">'+cs+'</td><td><div class="track-cell"><div class="track-info"><div class="track-title" title="'+escapeHtml(r.title)+'"><a href="'+createExternalUrl('lastfm',r.artist,r.title)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(r.title)+'</a></div><div class="track-artist" title="'+escapeHtml(r.artist)+'"><a href="'+createExternalUrl('discogs',r.artist,r.title)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(r.artist)+'</a></div></div><div class="track-links"><a class="inline-link" href="'+createExternalUrl('spotify',r.artist,r.title)+'" target="_blank" rel="noopener noreferrer" onclick="playPreviewAt('+index+');return false;" title="Spotifyで自動再生">▶</a><a class="inline-link" href="'+createExternalUrl('youtube',r.artist,r.title)+'" target="_blank" rel="noopener noreferrer" title="YouTubeで検索">YT</a></div></div></td><td class="days">'+(r.days||'-')+'</td><td class="peak">'+(r.peak||'-')+(r.peakx?'×'+r.peakx:'')+'</td><td class="streams">'+formatNumber(r.streams)+'</td><td class="streams">'+formatNumber(r.streams7)+'</td><td class="streams">'+formatNumber(r.total)+'</td></tr>';
  });
  h+='</tbody></table>';
  c.innerHTML=h;
}

async function loadChart(){
  const btn=document.getElementById('loadBtn'),country=document.getElementById('countrySelect').value;
  currentCountry=country;btn.disabled=true;btn.textContent='🔄 読み込み中...';
  showLoading('kworb.netからデータを取得中...');
  try{
    const url=CONFIG.kworbBase+country+'_daily.html',proxy=CONFIG.proxyBase+encodeURIComponent(url);
    const res=await fetch(proxy,{headers:{'Accept':'text/html'}});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const html=await res.text();
    chartData=parseKworbTable(html);renderChart(chartData,country);
  }catch(e){console.error('Fetch error:',e);showError('データの取得に失敗: '+e.message)}
  finally{btn.disabled=false;btn.textContent='🔄 チャートを読み込み'}
}

async function refreshChart(){if(chartData.length>0){showLoading('データを更新中...');await loadChart()}else loadChart()}

function parseKworbTable(html){
  const p=new DOMParser(),doc=p.parseFromString(html,'text/html'),table=doc.querySelector('table');
  if(!table)throw new Error('テーブルが見つかりません');
  const rows=[],tbody=table.querySelector('tbody')||table;
  tbody.querySelectorAll('tr').forEach(tr=>{
    const tds=tr.querySelectorAll('td');if(tds.length<6)return;
    try{
      const rank=parseInt(tds[0]?.textContent?.trim())||0,ct=(tds[1]?.textContent?.trim()||'0'),change=ct==='NEW'?999:ct==='RE'?0:parseInt(ct)||0;
      const at=tds[2]?.textContent?.trim()||'',{artist,title}=parseArtistTitle(at);
      const days=parseInt(tds[3]?.textContent?.trim())||0,pt=tds[4]?.textContent?.trim()||'0',peak=parseInt(pt)||0;
      const pm=pt.match(/\(x(\d+)\)/),peakx=pm?parseInt(pm[1]):0;
      const ps=t=>{const n=(t||'').replace(/[+,]/g,'').trim();return n?parseInt(n):0};
      rows.push({rank,change,artist,title,days,peak,peakx,streams:ps(tds[5]?.textContent),streams7:ps(tds[7]?.textContent),total:ps(tds[9]?.textContent)});
    }catch(e){console.warn('Parse error:',e)}
  });
  return rows;
}

document.addEventListener('DOMContentLoaded',()=>{document.addEventListener('keydown',handleEscape)});
</script>
</body>
</html>
