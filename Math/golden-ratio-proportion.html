<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黄金比例ネットワーク - GR Smartphone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .phone-frame {
            width: 390px;
            height: 844px;
            background: #000;
            border-radius: 50px;
            border: 12px solid #1a1a1a;
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 100;
        }
        
        .status-bar {
            position: absolute;
            top: 12px;
            left: 25px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            z-index: 99;
        }
        
        .container {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(10,10,26,0.95) 0%, rgba(26,26,46,0.95) 100%);
            padding: 50px 15px 90px;
            display: flex;
            flex-direction: column;
        }
        
        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 6px;
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }
        
        .phi-display {
            color: #667eea;
            text-align: center;
            margin-bottom: 6px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        
        .time-display {
            color: rgba(255,255,255,0.8);
            text-align: center;
            margin-bottom: 8px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }
        
        .info {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin-bottom: 10px;
            font-size: 11px;
        }
        
        #canvas {
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.4);
            background: rgba(10, 10, 26, 0.9);
            flex: 1;
            width: 100%;
        }
        
        .controls {
            position: absolute;
            bottom: 35px;
            left: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            z-index: 50;
        }
        
        button {
            padding: 10px 14px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
            flex: 1;
            min-width: 60px;
            max-width: 80px;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .stats {
            position: absolute;
            top: 85px;
            left: 10px;
            right: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            z-index: 50;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-label {
            font-size: 8px;
            opacity: 0.6;
            margin-bottom: 2px;
        }
        
        .stat-value {
            font-size: 13px;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
        }
        
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background: #fff;
            border-radius: 3px;
        }
        
        /* ギャルズ × Aya Dialogue Overlay */
        .dialogue-overlay {
            position: absolute;
            top: 120px;
            left: 10px;
            right: 10px;
            bottom: 120px;
            pointer-events: none;
            z-index: 60;
        }
        
        .dialogue-box {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            pointer-events: auto;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .speaker {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .speaker.gals {
            color: #ff6b9d;
        }
        
        .speaker.aya {
            color: #667eea;
        }
        
        .speaker-icon {
            font-size: 14px;
        }
        
        .dialogue-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            line-height: 1.6;
            letter-spacing: 0.3px;
        }
        
        .dialogue-controls {
            position: absolute;
            bottom: 5px;
            right: 10px;
            display: flex;
            gap: 5px;
            pointer-events: auto;
            z-index: 65;
        }
        
        .dialogue-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 15px;
            background: rgba(102, 126, 234, 0.6);
            color: white;
            font-size: 10px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        
        .dialogue-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="notch"></div>
        <div class="status-bar">
            <span id="clock">9:41</span>
            <span>📶 🔋</span>
        </div>
        
        <div class="container">
            <h1>黄金比例φ</h1>
            <div class="phi-display">1.6180339887...</div>
            <div class="time-display" id="elapsed">00:00:00</div>
            <div class="info">GR Smartphone Edition</div>
            
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">長方形</div>
                <div class="stat-value" id="rectCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">螺旋</div>
                <div class="stat-value" id="spiralCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">美指数</div>
                <div class="stat-value" id="beautyIndex">0.00</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">経過秒</div>
                <div class="stat-value" id="time">0</div>
            </div>
        </div>
        
        <!-- ギャルズ × Aya Dialogue -->
        <div class="dialogue-overlay" id="dialogueOverlay">
            <div class="dialogue-box" id="dialogueBox">
                <div class="speaker gals" id="speaker1">
                    <span class="speaker-icon">💬 ギャルズ</span>
                </div>
                <div class="dialogue-text" id="text1"></div>
            </div>
            <div class="dialogue-box" id="dialogueBox2" style="display: none;">
                <div class="speaker aya" id="speaker2">
                    <span class="speaker-icon">🎨 Aya</span>
                </div>
                <div class="dialogue-text" id="text2"></div>
            </div>
        </div>
        
        <div class="dialogue-controls">
            <button class="dialogue-btn" onclick="nextDialogue()">▶ 次</button>
            <button class="dialogue-btn" onclick="toggleDialogue()">💬 表示</button>
        </div>
        
        <div class="controls">
            <button onclick="toggleAnimation()">⏯</button>
            <button onclick="regenerate(6)">深6</button>
            <button onclick="regenerate(8)">深8</button>
            <button onclick="regenerate(10)">深10</button>
            <button onclick="toggleSpiral()">🌀</button>
            <button onclick="togglePhyllotaxis()">🌻</button>
            <button onclick="resetView()">🔄</button>
        </div>
        
        <div class="home-indicator"></div>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const PHI = (1 + Math.sqrt(5)) / 2;
        const GOLDEN_ANGLE = (2 * Math.PI) / (PHI * PHI);
        
        let currentDepth = 8;
        let animationId = null;
        let time = 0;
        let showSpiral = true;
        let showPhyllotaxis = false;
        let rectangles = [];
        let spiralPoints = [];
        let phyllotaxisPoints = [];
        let colors = [];
        
        // Fibonacci calculation
        function fibonacci(n) {
            if (n <= 0) return 0;
            if (n === 1) return 1;
            let a = 0, b = 1;
            for (let i = 2; i <= n; i++) {
                [a, b] = [b, a + b];
            }
            return b;
        }
        
        // Golden recursive split
        function goldenSplit(x, y, width, height, depth) {
            if (depth <= 0) {
                return [[x, y, width, height]];
            }
            
            const vertical = width > height;
            const split = vertical ? width / PHI : height / PHI;
            
            if (vertical) {
                return [
                    ...goldenSplit(x, y, split, height, depth - 1),
                    ...goldenSplit(x + split, y, width - split, height, depth - 1)
                ];
            } else {
                return [
                    ...goldenSplit(x, y, width, split, depth - 1),
                    ...goldenSplit(x, y + split, width, height - split, depth - 1)
                ];
            }
        }
        
        // Generate spiral points
        function generateSpiral(count) {
            const points = [];
            let angle = 0;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = 8;
            
            for (let i = 1; i <= count; i++) {
                const fib = fibonacci(i);
                const radius = fib * scale;
                points.push({
                    x: centerX + radius * Math.cos(angle),
                    y: centerY + radius * Math.sin(angle),
                    fib: fib
                });
                angle += Math.PI / 2;
            }
            
            return points;
        }
        
        // Generate phyllotaxis points
        function generatePhyllotaxis(count) {
            const points = [];
            const scale = 12;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            for (let i = 0; i < count; i++) {
                const angle = i * GOLDEN_ANGLE;
                const radius = scale * Math.sqrt(i);
                points.push({
                    x: centerX + radius * Math.cos(angle),
                    y: centerY + radius * Math.sin(angle),
                    index: i
                });
            }
            
            return points;
        }
        
        // Generate HSL color
        function generateColor(index, total) {
            const hue = (index * 360 / total * PHI) % 360;
            return `hsl(${hue}, 70%, 60%)`;
        }
        
        // Calculate beauty index
        function calculateBeautyIndex(width, height) {
            const ratio = Math.max(width, height) / Math.min(width, height);
            const logRatio = Math.log(ratio);
            const logPhi = Math.log(PHI);
            const beauty = 1 - Math.abs(logRatio - logPhi) / logPhi;
            return Math.max(0, Math.min(1, beauty));
        }
        
        // Regenerate all elements
        function regenerate(depth) {
            currentDepth = depth;
            rectangles = goldenSplit(0, 0, canvas.width, canvas.height, depth);
            spiralPoints = generateSpiral(Math.min(rectangles.length, 15));
            phyllotaxisPoints = generatePhyllotaxis(200);
            colors = rectangles.map((_, i) => generateColor(i, rectangles.length));
            
            document.getElementById('rectCount').textContent = rectangles.length;
            document.getElementById('spiralCount').textContent = spiralPoints.length;
            
            const beauty = calculateBeautyIndex(canvas.width, canvas.height);
            document.getElementById('beautyIndex').textContent = beauty.toFixed(3);
            
            if (!animationId) {
                draw();
            }
        }
        
        // Draw rectangles
        function drawRectangles() {
            rectangles.forEach((rect, i) => {
                const [x, y, w, h] = rect;
                
                ctx.fillStyle = colors[i] || 'rgba(102, 126, 234, 0.3)';
                ctx.globalAlpha = 0.4 + Math.sin(time * 0.03 + i * 0.5) * 0.2;
                ctx.fillRect(x, y, w, h);
                
                ctx.globalAlpha = 0.8;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(x, y, w, h);
                
                if (i < 20) {
                    ctx.fillStyle = '#fff';
                    ctx.font = '11px Courier New';
                    ctx.globalAlpha = 1.0;
                    ctx.fillText(`F(${i+1})`, x + 5, y + 15);
                }
            });
        }
        
        // Draw golden spiral
        function drawSpiral() {
            if (!showSpiral || spiralPoints.length < 2) return;
            
            ctx.beginPath();
            ctx.moveTo(spiralPoints[0].x, spiralPoints[0].y);
            
            for (let i = 1; i < spiralPoints.length; i++) {
                ctx.lineTo(spiralPoints[i].x, spiralPoints[i].y);
            }
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#667eea';
            ctx.shadowBlur = 15;
            ctx.globalAlpha = 0.9;
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            spiralPoints.forEach((point, i) => {
                ctx.beginPath();
                ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = colors[i] || '#667eea';
                ctx.globalAlpha = 0.8;
                ctx.fill();
            });
        }
        
        // Draw phyllotaxis
        function drawPhyllotaxis() {
            if (!showPhyllotaxis) return;
            
            phyllotaxisPoints.forEach((point, i) => {
                const size = 3 + Math.sin(time * 0.05 + i * 0.1) * 2;
                const hue = (i * 137.508) % 360;
                
                ctx.beginPath();
                ctx.arc(point.x, point.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 70%, 60%, 0.7)`;
                ctx.fill();
            });
        }
        
        // Main draw function
        function draw() {
            ctx.fillStyle = 'rgba(26, 26, 46, 0.15)';
            ctx.globalAlpha = 1.0;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawRectangles();
            drawSpiral();
            drawPhyllotaxis();
            
            if (animationId) {
                time++;
                document.getElementById('time').textContent = time;
                animationId = requestAnimationFrame(draw);
            }
        }
        
        // Controls
        function toggleAnimation() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            } else {
                time = 0;
                animationId = requestAnimationFrame(draw);
            }
        }
        
        function toggleSpiral() {
            showSpiral = !showSpiral;
            if (!animationId) draw();
        }
        
        function togglePhyllotaxis() {
            showPhyllotaxis = !showPhyllotaxis;
            if (!animationId) draw();
        }
        
        function resetView() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            time = 0;
            showSpiral = true;
            showPhyllotaxis = false;
            ctx.fillStyle = '#1a1a2e';
            ctx.globalAlpha = 1.0;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            regenerate(currentDepth);
        }
        
        // Initialize
        regenerate(currentDepth);
        
        // ============================================================
        // ギャルズ × Aya Dialogue System
        // ============================================================
        
        let dialogueIndex = 0;
        let dialogueVisible = true;
        
        const dialogues = [
            {
                speaker: 'gals',
                text: 'ねぇAyaちゃん、この spiral めっちゃ綺麗なんだけど！これ何？🌀'
            },
            {
                speaker: 'aya',
                text: 'それはフィボナッチ螺旋よ。1, 1, 2, 3, 5, 8, 13... って続く数列を視覚化したもの。'
            },
            {
                speaker: 'gals',
                text: '数字がこんな美しい形になるなんてヤバくない？！なんで？🤩'
            },
            {
                speaker: 'aya',
                text: '隣同士の数の比が黄金比 φ=1.618... に収束するから。自然界にもたくさんあるの。'
            },
            {
                speaker: 'gals',
                text: 'あ！ヒマワリの種のパターンとか？🌻'
            },
            {
                speaker: 'aya',
                text: 'そう！葉序（phyllotaxis）って言うの。展開角が137.5°＝黄金角度になってる。'
            },
            {
                speaker: 'gals',
                text: '137.5°って何その中途半端な数字w でもなんでそれが美しいの？'
            },
            {
                speaker: 'aya',
                text: '360°をφ²で割った数よ。これが植物が一番効率よく光を受けられる配置なんだって。'
            },
            {
                speaker: 'gals',
                text: '数学と自然が繋がってるのマジ神🙏 でもこの長方形の分割もヤバい！'
            },
            {
                speaker: 'aya',
                text: '黄金分割よ。長方形をφ:1の比で分割すると、残りも黄金長方形になるの。'
            },
            {
                speaker: 'gals',
                text: 'それって無限に続くってこと？！フラクタルみたい！🤯'
            },
            {
                speaker: 'aya',
                text: 'その通り！自己相似性を持っているの。パルテノン神殿もこの比例で設計されてる。'
            },
            {
                speaker: 'gals',
                text: 'あー、それで「美しい」って感じるんだ！わかるわ〜💕'
            },
            {
                speaker: 'aya',
                text: '人間の視覚もφに最適化されてるって説もあるの。脳の処理が楽になるから。'
            },
            {
                speaker: 'gals',
                text: 'ギャル的にもφはマジでvibe良い✨ 1.618...って数字可愛すぎ'
            },
            {
                speaker: 'aya',
                text: '無理数なのに無限に美しく続く...ロマンチックよね。'
            },
            {
                speaker: 'gals',
                text: 'ねえ、この色もいい感じ！なんでこんなにオシャレなの？🎨'
            },
            {
                speaker: 'aya',
                text: '色相環をφで回転させてるの。360°×φ mod 360°で黄金配色になる。'
            },
            {
                speaker: 'gals',
                text: '色彩理論にもφ使えちゃうんだ！デザイナー聖地📍'
            },
            {
                speaker: 'aya',
                text: 'ジョブズも比例にこだわってたわ。シンプルさの中にある数学的美しさ。'
            },
            {
                speaker: 'gals',
                text: 'Ayaちゃん語るの熱いww でもわかる、この vibe 最高🔥'
            },
            {
                speaker: 'aya',
                text: 'このHTML、スマホ画面で見てるでしょ？390×844pxの黄金比フレームよ。'
            },
            {
                speaker: 'gals',
                text: 'iPhoneの画面サイズ！それでこんなしっくり来るんだ📱'
            },
            {
                speaker: 'aya',
                text: 'フィボナッチ素数は52個しか見つかってないの。もっとあるかも？'
            },
            {
                speaker: 'gals',
                text: '未解決問題とかヤバ...ロマンありすぎる✨ 探したくなる！'
            },
            {
                speaker: 'aya',
                text: 'あなたも新しいフィボナッチ素数を見つけられるかも。F(144307)が現在最大よ。'
            },
            {
                speaker: 'gals',
                text: '3万桁とか正気じゃないw でも数学ってこうやって視覚化すると最高！'
            },
            {
                speaker: 'aya',
                text: '紙の論文より、実際に動くコードで理解する方が深いよね。'
            },
            {
                speaker: 'gals',
                text: 'ギャルも納得のGRアート💖 数学×デザイン＝最強🔥'
            },
            {
                speaker: 'aya',
                text: 'bonsaiさんの論文、ちゃんと参考文献18個ついてるでしょ？學術的にも完璧。'
            },
            {
                speaker: 'gals',
                text: 'おけまり〜！次はどのパターン見せて？👀'
            }
        ];
        
        function showDialogue() {
            if (!dialogueVisible) return;
            
            const current = dialogues[dialogueIndex % dialogues.length];
            const box1 = document.getElementById('dialogueBox');
            const box2 = document.getElementById('dialogueBox2');
            const speaker1 = document.getElementById('speaker1');
            const text1 = document.getElementById('text1');
            const speaker2 = document.getElementById('speaker2');
            const text2 = document.getElementById('text2');
            
            if (current.speaker === 'gals') {
                box1.style.display = 'block';
                speaker1.className = 'speaker gals';
                speaker1.innerHTML = '<span class="speaker-icon">💬 ギャルズ</span>';
                text1.textContent = current.text;
                box2.style.display = 'none';
            } else {
                box1.style.display = 'block';
                speaker1.className = 'speaker aya';
                speaker1.innerHTML = '<span class="speaker-icon">🎨 Aya</span>';
                text1.textContent = current.text;
                box2.style.display = 'none';
            }
            
            // Fade animation
            box1.style.animation = 'none';
            setTimeout(() => { box1.style.animation = 'fadeIn 0.5s ease'; }, 10);
        }
        
        function nextDialogue() {
            dialogueIndex++;
            showDialogue();
        }
        
        function toggleDialogue() {
            dialogueVisible = !dialogueVisible;
            const overlay = document.getElementById('dialogueOverlay');
            const controls = document.querySelector('.dialogue-controls');
            
            if (dialogueVisible) {
                overlay.style.display = 'block';
                controls.style.display = 'flex';
                showDialogue();
            } else {
                overlay.style.display = 'none';
            }
        }
        
        // Auto-advance dialogue every 8 seconds
        setInterval(() => {
            if (dialogueVisible) {
                nextDialogue();
            }
        }, 8000);
        
        // Show first dialogue
        showDialogue();
    </script>
</body>
</html>
