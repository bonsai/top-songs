<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Fireworks — φ Rainbow Explosion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: -apple-system, sans-serif;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0; left: 0;
        }
        .info {
            position: fixed;
            bottom: 20px;
            left: 0; right: 0;
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 11px;
            z-index: 10;
            pointer-events: none;
        }
        .title {
            position: fixed;
            top: 20px;
            left: 0; right: 0;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 3px;
            z-index: 10;
            pointer-events: none;
        }
        .controls {
            position: fixed;
            bottom: 50px;
            left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 20;
        }
        .controls button {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .controls button:active {
            background: rgba(255,255,255,0.3);
        }
        .controls button.active {
            background: rgba(102,126,234,0.5);
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="title">φ RAINBOW EXPLOSION</div>
    <div class="controls">
        <button onclick="setMode('phyllotaxis')" class="active" id="btn-phyllotaxis">🌻 葉序</button>
        <button onclick="setMode('spiral')" id="btn-spiral">🌀 螺旋</button>
        <button onclick="setMode('galaxy')" id="btn-galaxy">🌌 銀河</button>
        <button onclick="setMode('mandala')" id="btn-mandala">🔮 曼荼羅</button>
    </div>
    <div class="info">bonsai/qwen3.6-plus | golden angle 137.508°</div>

    <script>
    // ============================================================
    // Golden Ratio Constants
    // ============================================================
    const PHI = (1 + Math.sqrt(5)) / 2;
    const GOLDEN_ANGLE = 137.508;
    const GOLDEN_RAD = GOLDEN_ANGLE * Math.PI / 180;
    const TAU = Math.PI * 2;

    // ============================================================
    // Canvas Setup
    // ============================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const W = () => canvas.width;
    const H = () => canvas.height;
    const CX = () => W() / 2;
    const CY = () => H() / 2;

    // ============================================================
    // Particle System
    // ============================================================
    class Particle {
        constructor(x, y, angle, speed, hue, size, life) {
            this.x = x;
            this.y = y;
            this.angle = angle;
            this.speed = speed;
            this.hue = hue;
            this.baseSize = size;
            this.life = life;
            this.maxLife = life;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.trail = [];
            this.maxTrail = 8;
            this.wobble = Math.random() * TAU;
            this.wobbleSpeed = 0.02 + Math.random() * 0.03;
        }

        update() {
            this.trail.push({ x: this.x, y: this.y });
            if (this.trail.length > this.maxTrail) this.trail.shift();

            this.wobble += this.wobbleSpeed;
            const wobbleForce = Math.sin(this.wobble) * 0.3;
            
            this.vx += wobbleForce * Math.cos(this.angle + Math.PI / 2);
            this.vy += wobbleForce * Math.sin(this.angle + Math.PI / 2);
            
            this.x += this.vx;
            this.y += this.vy;
            this.life--;
            
            // Gravity-like slow pull toward center
            const dx = CX() - this.x;
            const dy = CY() - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 100) {
                this.vx += dx * 0.0001;
                this.vy += dy * 0.0001;
            }
        }

        draw(ctx) {
            const alpha = Math.max(0, this.life / this.maxLife);
            const size = this.baseSize * alpha;

            // Draw trail
            if (this.trail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(this.trail[0].x, this.trail[0].y);
                for (let i = 1; i < this.trail.length; i++) {
                    ctx.lineTo(this.trail[i].x, this.trail[i].y);
                }
                ctx.strokeStyle = `hsla(${this.hue}, 80%, 60%, ${alpha * 0.4})`;
                ctx.lineWidth = size * 0.5;
                ctx.stroke();
            }

            // Draw particle
            ctx.beginPath();
            ctx.arc(this.x, this.y, size, 0, TAU);
            const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, size * 2);
            gradient.addColorStop(0, `hsla(${this.hue}, 90%, 70%, ${alpha})`);
            gradient.addColorStop(0.5, `hsla(${this.hue}, 80%, 60%, ${alpha * 0.6})`);
            gradient.addColorStop(1, `hsla(${this.hue}, 70%, 50%, 0)`);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        isDead() {
            return this.life <= 0;
        }
    }

    // ============================================================
    // Firework Burst
    // ============================================================
    class Firework {
        constructor(x, y, mode) {
            this.particles = [];
            this.mode = mode;
            this.x = x;
            this.y = y;
            this.spawn();
        }

        spawn() {
            const count = this.mode === 'mandala' ? 300 : 
                          this.mode === 'galaxy' ? 250 :
                          this.mode === 'spiral' ? 200 : 180;
            
            const baseHue = Math.random() * 360;
            const baseSpeed = 2 + Math.random() * 3;

            for (let i = 0; i < count; i++) {
                let angle, speed, hue, size, life;

                switch (this.mode) {
                    case 'phyllotaxis': {
                        // Golden angle phyllotaxis
                        angle = i * GOLDEN_RAD;
                        const r = 3 + Math.sqrt(i) * 0.8;
                        speed = r * 0.4 + Math.random() * 0.5;
                        hue = (baseHue + i * GOLDEN_ANGLE * 0.5) % 360;
                        size = 1.5 + Math.random() * 2;
                        life = 80 + Math.random() * 60;
                        break;
                    }
                    case 'spiral': {
                        // Logarithmic spiral
                        const spiralAngle = i * TAU / count * 3;
                        const spiralR = i * 0.08;
                        angle = spiralAngle + Math.random() * 0.2;
                        speed = baseSpeed + spiralR * 0.3;
                        hue = (baseHue + i * 2.5) % 360;
                        size = 1.5 + Math.random() * 2.5;
                        life = 100 + Math.random() * 80;
                        break;
                    }
                    case 'galaxy': {
                        // Galaxy arms (3-armed spiral)
                        const arm = i % 3;
                        const armAngle = arm * TAU / 3;
                        const dist = Math.sqrt(i) * 1.2;
                        angle = armAngle + dist * 0.05 + (Math.random() - 0.5) * 0.3;
                        speed = dist * 0.15 + 1;
                        hue = (baseHue + dist * 0.8 + arm * 120) % 360;
                        size = 1 + Math.random() * 2.5;
                        life = 120 + Math.random() * 100;
                        break;
                    }
                    case 'mandala': {
                        // Sacred geometry mandala
                        const layers = 6;
                        const layer = Math.floor(i / (count / layers));
                        const inLayer = i % (count / layers);
                        const ptsInLayer = count / layers;
                        angle = inLayer * TAU / ptsInLayer + layer * GOLDEN_RAD * 0.1;
                        speed = 1.5 + layer * 1.2 + Math.random() * 0.5;
                        hue = (baseHue + layer * 55 + inLayer * 3) % 360;
                        size = 1 + Math.random() * 3 - layer * 0.3;
                        life = 100 + layer * 20 + Math.random() * 50;
                        break;
                    }
                }

                this.particles.push(new Particle(
                    this.x, this.y, angle, speed, hue, size, life
                ));
            }
        }

        update() {
            this.particles.forEach(p => p.update());
            this.particles = this.particles.filter(p => !p.isDead());
        }

        draw(ctx) {
            this.particles.forEach(p => p.draw(ctx));
        }

        isDead() {
            return this.particles.length === 0;
        }
    }

    // ============================================================
    // Central Ring (fixed shape)
    // ============================================================
    class CentralRing {
        constructor() {
            this.points = [];
            this.count = 60;
            for (let i = 0; i < this.count; i++) {
                this.points.push({
                    angle: i * TAU / this.count,
                    baseR: 40 + Math.sin(i * 0.3) * 10,
                    pulse: Math.random() * TAU,
                    pulseSpeed: 0.02 + Math.random() * 0.02
                });
            }
        }

        update() {
            this.points.forEach(p => {
                p.pulse += p.pulseSpeed;
            });
        }

        draw(ctx) {
            const cx = CX();
            const cy = CY();
            const time = Date.now() * 0.001;

            // Outer glow
            const glowGrad = ctx.createRadialGradient(cx, cy, 20, cx, cy, 80);
            glowGrad.addColorStop(0, 'rgba(102, 126, 234, 0.15)');
            glowGrad.addColorStop(1, 'rgba(102, 126, 234, 0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, 80, 0, TAU);
            ctx.fill();

            // Ring points
            this.points.forEach((p, i) => {
                const r = p.baseR + Math.sin(p.pulse) * 8 + Math.sin(time * 2 + i * 0.1) * 5;
                const x = cx + Math.cos(p.angle + time * 0.3) * r;
                const y = cy + Math.sin(p.angle + time * 0.3) * r;
                const hue = (i * 6 + time * 30) % 360;
                const size = 2 + Math.sin(p.pulse) * 1;

                ctx.beginPath();
                ctx.arc(x, y, size, 0, TAU);
                ctx.fillStyle = `hsla(${hue}, 80%, 65%, 0.8)`;
                ctx.fill();

                // Connect to neighbors
                if (i > 0) {
                    const prev = this.points[i - 1];
                    const prevR = prev.baseR + Math.sin(prev.pulse) * 8 + Math.sin(time * 2 + (i-1) * 0.1) * 5;
                    const px = cx + Math.cos(prev.angle + time * 0.3) * prevR;
                    const py = cy + Math.sin(prev.angle + time * 0.3) * prevR;
                    
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(x, y);
                    ctx.strokeStyle = `hsla(${(hue + prev.angle * 30) % 360}, 70%, 60%, 0.3)`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            });

            // Center dot
            const centerHue = (time * 50) % 360;
            ctx.beginPath();
            ctx.arc(cx, cy, 5 + Math.sin(time * 3) * 2, 0, TAU);
            const cGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 15);
            cGrad.addColorStop(0, `hsla(${centerHue}, 90%, 80%, 0.9)`);
            cGrad.addColorStop(1, `hsla(${centerHue}, 80%, 60%, 0)`);
            ctx.fillStyle = cGrad;
            ctx.fill();
        }
    }

    // ============================================================
    // Main Animation Loop
    // ============================================================
    let fireworks = [];
    let currentMode = 'phyllotaxis';
    let lastFireworkTime = 0;
    let fireworkInterval = 2000;
    const centralRing = new CentralRing();
    let globalTime = 0;

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + mode)?.classList.add('active');
        
        switch (mode) {
            case 'phyllotaxis': fireworkInterval = 2500; break;
            case 'spiral': fireworkInterval = 1800; break;
            case 'galaxy': fireworkInterval = 2200; break;
            case 'mandala': fireworkInterval = 3000; break;
        }
    }

    function spawnFirework() {
        const now = Date.now();
        if (now - lastFireworkTime > fireworkInterval) {
            // Spawn at random positions around center
            const angle = Math.random() * TAU;
            const dist = 80 + Math.random() * 150;
            const x = CX() + Math.cos(angle) * dist;
            const y = CY() + Math.sin(angle) * dist;
            
            fireworks.push(new Firework(x, y, currentMode));
            lastFireworkTime = now;
        }
    }

    function animate() {
        globalTime++;

        // Fade effect
        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        ctx.fillRect(0, 0, W(), H());

        // Update and draw central ring
        centralRing.update();
        centralRing.draw(ctx);

        // Spawn new fireworks
        spawnFirework();

        // Update and draw fireworks
        fireworks.forEach(fw => {
            fw.update();
            fw.draw(ctx);
        });
        fireworks = fireworks.filter(fw => !fw.isDead());

        // Background stars (subtle)
        if (globalTime % 60 === 0) {
            for (let i = 0; i < 3; i++) {
                const x = Math.random() * W();
                const y = Math.random() * H();
                const hue = Math.random() * 360;
                ctx.beginPath();
                ctx.arc(x, y, 0.5, 0, TAU);
                ctx.fillStyle = `hsla(${hue}, 50%, 80%, 0.3)`;
                ctx.fill();
            }
        }

        requestAnimationFrame(animate);
    }

    // Start!
    animate();
    </script>
</body>
</html>
